openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Burme AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI chat and streaming operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chat:
    post:
      operationId: sendChat
      tags: [ai]
      summary: Send a chat message
      description: Send a message and get a complete AI response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /history:
    get:
      operationId: getChatHistory
      tags: [ai]
      summary: Get chat history
      description: Retrieve recent chat messages from the session
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"

    delete:
      operationId: clearChatHistory
      tags: [ai]
      summary: Clear chat history
      description: Clear all messages for a session
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: History cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /models:
    get:
      operationId: getModels
      tags: [ai]
      summary: Get available AI modes
      description: Returns available chat modes and prompt templates
      responses:
        "200":
          description: List of available modes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ChatRequest:
      type: object
      properties:
        message:
          type: string
          description: The user's input message
        mode:
          type: string
          enum: [chat, code, translate, explain]
          default: chat
          description: The AI mode to use
        sessionId:
          type: string
          description: Optional session ID for conversation history
      required:
        - message

    ChatResponse:
      type: object
      properties:
        response:
          type: string
          description: The AI's response text
        mode:
          type: string
        sessionId:
          type: string
        tokensUsed:
          type: integer
      required:
        - response
        - mode
        - sessionId

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        mode:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - role
        - content
        - timestamp

    ChatHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        sessionId:
          type: string
        total:
          type: integer
      required:
        - messages
        - sessionId
        - total

    AiMode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
      required:
        - id
        - name
        - description
        - icon

    ModelsResponse:
      type: object
      properties:
        modes:
          type: array
          items:
            $ref: "#/components/schemas/AiMode"
        defaultMode:
          type: string
      required:
        - modes
        - defaultMode

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
